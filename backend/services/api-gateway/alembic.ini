[alembic]
# path to migration files
script_location = alembic
sqlalchemy.url = postgresql+psycopg://postgres:admin@localhost:5433/tenderaidb

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# max length of characters to apply to the slug field
truncate_slug_length = 40

# Uncomment to run the environment during 'revision', regardless of autogenerate
# on_init = false
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
