[tool.poetry]
name = "tenderai-api-gateway"
version = "1.0.0"
description = "TenderAI API Gateway"
authors = ["TenderAI Team"]
packages = []

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
psycopg = {extras = ["binary"], version = "^3.1.0"}
psycopg2-binary = "^2.9.9"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
cryptography = "^42.0.0"
argon2-cffi = "^23.1.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
redis = "^5.0.0"
minio = "^7.2.0"
hvac = "^2.1.0"
pyotp = "^2.9.0"
qrcode = {extras = ["pil"], version = "^7.4.0"}
python-dotenv = "^1.0.0"
email-validator = "^2.1.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
slowapi = "^0.1.9"
PyJWT = {extras = ["crypto"], version = "^2.8.0"}
pgvector = "^0.3.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.0.0"}
python-magic = "0.4.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
